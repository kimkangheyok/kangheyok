    screen.querySelector('#historyButton').addEventListener('click',()=>{goalMode='history';renderGoals()});screen.querySelector('#prevMonth').addEventListener('click',()=>{viewMonth=new Date(year,month-1,1);renderGoals()});screen.querySelector('#nextMonth').addEventListener('click',()=>{viewMonth=new Date(year,month+1,1);renderGoals()});screen.querySelector('#thisMonth').addEventListener('click',()=>{viewMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);selectedDate=todayKey();renderGoals()});screen.querySelectorAll('[data-date]').forEach(button=>button.addEventListener('click',()=>{selectedDate=button.dataset.date;renderGoals()}));const textarea=screen.querySelector('#dailyText');textarea.addEventListener('input',()=>{const entry=entryFor(selectedDate,true);entry.text=textarea.value;clearTimeout(journalSaveTimer);journalSaveTimer=setTimeout(saveProfile,300);const tag=screen.querySelector('.selected-date-title');const saved=tag.querySelector('.saved-tag');if(textarea.value.trim()&&!saved)tag.insertAdjacentHTML('beforeend','<span class="saved-tag">기록 저장됨</span>');if(!textarea.value.trim()&&saved)saved.remove();refreshCalendarDots()});textarea.addEventListener('blur',saveProfile);screen.querySelector('#photoInput').addEventListener('change',handlePhotoUpload);bindPhotoViewer()}
  function refreshCalendarDots(){if(page!=='goals'||goalMode!=='calendar')return;screen.querySelectorAll('[data-date]').forEach(button=>{const entry=entryFor(button.dataset.date);let dot=button.querySelector('.day-dot');const hasRecord=!!(entry&&(entry.text?.trim()||entry.photos?.length));if(hasRecord&&!dot){dot=document.createElement('i');dot.className='day-dot';button.append(dot)}if(!hasRecord&&dot)dot.remove();if(dot&&entry?.photos?.length)dot.classList.add('has-photo');else if(dot)dot.classList.remove('has-photo')})}
  function renderEarn(){if(!profile){screen.innerHTML=needProfileMarkup('돈벌기 전에 이름과 친구를 먼저 정해주세요.');bindNeedProfile();return}const daily=dailyLaborQuota(),limitReached=daily.count>=4;screen.innerHTML=`<div class="page-heading"><div><div class="eyebrow">30 SECOND MINI JOBS</div><h1>오늘의 돈벌기</h1><p>일 하나를 골라 30초만 집중하면 코인을 받아요.</p></div><span class="world-chip">🪙 ${profile.coins.toLocaleString('ko-KR')} 코인</span></div><div class="section-note">오늘 노동 <b>${daily.count}/4회</b> · 같은 일은 연속으로 할 수 없어요. 보상은 현재 레벨에 따라 높아져요.</div><div class="job-grid">${jobs.map(job=>{const repeated=daily.lastJob===job.id;return`<article class="job-card"><div class="job-emoji">${job.emoji}</div><h3>${job.name}</h3><p>${job.desc}</p><div class="job-reward">예상 보상 🪙 ${workReward(job)}</div><button data-work="${job.id}" ${limitReached||repeated?'disabled':''}>${limitReached?'오늘 횟수 완료':repeated?'다른 일을 먼저 해요':'30초 일하기'}</button></article>`}).join('')}</div>`;screen.querySelectorAll('[data-work]').forEach(button=>button.addEventListener('click',()=>startWork(button.dataset.work)))}
  function renderShop(){if(!profile){screen.innerHTML=needProfileMarkup('상점을 이용하려면 먼저 이름과 친구를 정해주세요.');bindNeedProfile();return}screen.innerHTML=`<div class="page-heading"><div><div class="eyebrow">MAKE YOUR HOME YOURS</div><h1>작은 정원 상점</h1><p>일해서 모은 코인으로 홈을 꾸밀 수 있어요.</p></div><span class="world-chip">🪙 ${profile.coins.toLocaleString('ko-KR')}</span></div><div class="shop-grid">${catalog.map(item=>{const owned=(profile.ownedItems||[]).includes(item.id),placed=(profile.decorations||[]).includes(item.id);return`<article class="shop-item"><div class="item-art">${item.emoji}</div><h3>${item.name}</h3><p>${item.desc}</p><div class="price">🪙 ${item.price}</div><button class="${placed?'placed':owned?'owned':''}" data-item="${item.id}">${placed?'배치 중 · 치우기':owned?'배치하기':'구입하기'}</button></article>`}).join('')}</div>`;screen.querySelectorAll('[data-item]').forEach(button=>button.addEventListener('click',()=>purchaseOrPlace(button.dataset.item)))}
  function renderSettings(){if(!profile){screen.innerHTML=needProfileMarkup('설정을 바꾸려면 먼저 이름과 친구를 정해주세요.');bindNeedProfile();return}const pet=pets[profile.pet],stage=stageFor(profile.level);screen.innerHTML=`<div class="page-heading"><div><div class="eyebrow">YOUR ACCOUNT</div><h1>설정</h1><p>이름과 함께할 친구를 바꿀 수 있어요.</p></div></div><div class="settings-list"><div class="setting-row"><div class="settings-profile"><img src="${pet.stages[stage]}" alt="${pet.name}"><div><strong>${escapeHtml(profile.name)} · ${pet.name}</strong><small>LEVEL ${profile.level} · 경험치 ${profile.xp}/${xpNeeded(profile.level)}</small></div></div><button class="soft-button" id="editProfile">프로필 수정</button></div><div class="setting-row"><div><strong>진행 상황 저장</strong><small>계정에 로그인하면 Supabase와 이 브라우저에 저장돼요.</small></div><span>✓</span></div><div class="setting-row"><div><strong>사진 경험치</strong><small>사진을 추가할 때마다 경험치 20을 받아요.</small></div><span>📷</span></div></div>`;if(activeUser)screen.querySelector('.settings-list').insertAdjacentHTML('beforeend','<div class="setting-row"><div><strong>계정</strong><small>로그인됨 · '+escapeHtml(activeUser.email||'')+'</small></div><button class="soft-button" id="logoutButton">로그아웃</button></div>');screen.querySelector('#editProfile').addEventListener('click',openLogin);screen.querySelector('#logoutButton')?.addEventListener('click',async()=>{if(isWorking()||!supabaseClient)return;const{error}=await supabaseClient.auth.signOut();if(error){toast('로그아웃하지 못했어요. 다시 시도해 주세요.');return}activeUser=null;profile=null;workSession=null;try{localStorage.removeItem('naesaeng-work')}catch{}render();openLogin('login')})}
  function needProfileMarkup(message){return`<div class="empty-state"><div class="eyebrow">LET'S BEGIN</div><h1>먼저 친구를 만나볼까요?</h1><p>${message}</p><button class="primary" data-login>이름과 캐릭터 정하기</button></div>`}
  function bindNeedProfile(){screen.querySelector('[data-login]')?.addEventListener('click',openLogin)}
  function formatDate(key){const d=new Date(`${key}T12:00:00`);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
  function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function setAuthMode(mode){authMode=mode;const profileMode=mode==='profile',loginMode=mode==='login';document.getElementById('loginTitle').textContent=profileMode?'내 프로필':loginMode?'로그인':'계정 만들기';document.getElementById('loginDescription').textContent=profileMode?'이름과 함께 키울 친구를 바꿀 수 있어요.':loginMode?'계정에 로그인해 이어서 모험을 즐겨요.':'이메일과 비밀번호로 계정을 만들고, 나만의 친구와 모험을 시작해요.';document.getElementById('authSwitch').hidden=profileMode&&!!activeUser;document.getElementById('emailField').hidden=profileMode;document.getElementById('passwordField').hidden=profileMode;document.getElementById('profileFields').hidden=loginMode;document.getElementById('accountEmail').required=!profileMode;document.getElementById('accountPassword').required=!profileMode;document.getElementById('profileName').required=!loginMode;document.getElementById('accountPassword').autocomplete=loginMode?'current-password':'new-password';document.getElementById('profileSubmit').textContent=profileMode?'저장하고 계속하기':loginMode?'로그인':'계정 만들기';document.getElementById('loginFoot').textContent=profileMode?'계정 진행 상황은 Supabase와 이 브라우저에 저장돼요.':'로그인과 계정 관리는 Supabase가 처리해요.';document.querySelectorAll('[data-auth-mode]').forEach(button=>button.classList.toggle('active',button.dataset.authMode===mode))}
  function openLogin(mode){if(isWorking())return;const name=document.getElementById('profileName'),options=document.getElementById('petOptions');name.value=profile?.name||'';document.getElementById('accountEmail').value=activeUser?.email||'';document.getElementById('accountPassword').value='';selectedPet=profile?.pet||selectedPet;options.innerHTML=petKeys.map(key=>'<button type="button" class="pet-choice '+(selectedPet===key?'selected':'')+'" data-pet="'+key+'"><img src="'+pets[key].stages[0]+'" alt="'+pets[key].name+'"><strong>'+pets[key].name+'</strong><span>'+pets[key].evolution[0]+'</span></button>').join('');options.querySelectorAll('[data-pet]').forEach(button=>button.addEventListener('click',()=>{selectedPet=button.dataset.pet;options.querySelectorAll('[data-pet]').forEach(option=>option.classList.toggle('selected',option===button))}));setAuthMode(mode||(activeUser?'profile':profile?'profile':'signup'));loginModal.classList.remove('hidden');setTimeout(()=>{if(authMode==='profile')name.focus();else document.getElementById('accountEmail').focus()},50)}
  document.querySelectorAll('[data-auth-mode]').forEach(button=>button.addEventListener('click',()=>setAuthMode(button.dataset.authMode)));
  document.getElementById('profileForm').addEventListener('submit',async event=>{event.preventDefault();if(isWorking())return;if(authMode==='profile'){const name=document.getElementById('profileName').value.trim();if(!name){toast('이름을 입력해 주세요.');return}profile.name=name;profile.pet=selectedPet;saveProfile();loginModal.classList.add('hidden');render();toast('프로필을 저장했어요.');return}if(!supabaseClient){toast('Supabase 프로젝트 URL과 공개 키를 index.html에 먼저 설정해 주세요.');return}const email=document.getElementById('accountEmail').value.trim().toLowerCase(),password=document.getElementById('accountPassword').value;try{if(authMode==='signup'){if(password.length<8){toast('비밀번호를 8자 이상 입력해 주세요.');return}const name=document.getElementById('profileName').value.trim();if(!name){toast('이름을 입력해 주세요.');return}const guestProfile=profile,{data,error}=await supabaseClient.auth.signUp({email:email,password:password,options:{data:{name:name,pet:selectedPet}}});if(error){toast('가입에 실패했어요. 이메일과 비밀번호 설정을 확인해 주세요.');console.error('Supabase sign-up failed:',error);return}if(data.session&&data.user){activeUser=data.user;profile=await loadUserProfile(activeUser,guestProfile);saveProfile();loginModal.classList.add('hidden');render();toast('계정이 만들어졌어요. 모험을 시작해요!')}else{document.getElementById('loginFoot').textContent='Supabase Auth에서 이메일 확인을 꺼야 가입 즉시 로그인돼요.';toast('Supabase Auth의 Confirm email 설정을 꺼 주세요.')}return}else{const guestProfile=profile,{data,error}=await supabaseClient.auth.signInWithPassword({email:email,password:password});if(error){toast('로그인에 실패했어요. 이메일과 비밀번호를 확인해 주세요.');console.error('Supabase sign-in failed:',error);return}activeUser=data.user;profile=await loadUserProfile(activeUser,guestProfile);saveProfile();loginModal.classList.add('hidden');render();toast('로그인했어요. 모험을 이어가요!')}}catch(error){toast('Supabase에 연결하지 못했어요. 프로젝트 설정과 네트워크를 확인해 주세요.');console.error('Supabase auth failed:',error)}});
  document.getElementById('loginButton').addEventListener('click',()=>openLogin());
  document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.close).classList.add('hidden')));document.querySelectorAll('.modal-backdrop').forEach(backdrop=>backdrop.addEventListener('click',event=>{if(event.target===backdrop)backdrop.classList.add('hidden')}));
  function addExperience(amount){if(!profile)return;const oldStage=stageFor(profile.level);profile.xp+=amount;while(profile.xp>=xpNeeded(profile.level)){profile.xp-=xpNeeded(profile.level);profile.level++}const newStage=stageFor(profile.level);saveProfile();renderProfile();if(newStage>oldStage){const pet=pets[profile.pet];document.getElementById('evolutionTitle').textContent=`LEVEL ${profile.level} · ${pet.evolution[newStage]}`;document.getElementById('evolutionImage').src=pet.stages[newStage];document.getElementById('evolutionImage').alt=pet.evolution[newStage];document.getElementById('evolutionMessage').textContent=`${amount} 경험치를 모아 ${pet.pet}가 새로운 모습으로 진화했어요!`;document.getElementById('evolutionModal').classList.remove('hidden');if(page==='home')renderHome()}else toast(`경험치 +${amount} · 다음 레벨까지 ${xpNeeded(profile.level)-profile.xp}`)}
  function compressImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{const scale=Math.min(1,800/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.76))};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image'))};image.src=url})}
  async function handlePhotoUpload(event){const files=[...(event.target.files||[])].filter(file=>file.type.startsWith('image/'));if(!files.length)return;const quota=dailyPhotoQuota(),remaining=Math.max(0,3-quota.count);if(!remaining){toast('오늘 사진은 최대 3장까지 올릴 수 있어요.');event.target.value='';return}const selectedFiles=files.slice(0,remaining),entry=entryFor(selectedDate,true);let added=0;for(const file of selectedFiles){try{const src=await compressImage(file);entry.photos.push({src,name:file.name,at:Date.now()});added++}catch{toast('일부 사진을 읽지 못했어요.')}}if(added){quota.count+=added;saveProfile();addExperience(added*20);if(page==='goals')renderGoals();toast(`사진 ${added}장 저장 · 경험치 +${added*20} · 오늘 ${quota.count}/3장${files.length>remaining?' (일일 최대 도달)':''}`)}event.target.value=''}
  function bindPhotoViewer(){screen.querySelectorAll('[data-photo]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('lightboxImage').src=button.dataset.photo;document.getElementById('lightbox').classList.remove('hidden')}))}
  document.getElementById('lightbox').addEventListener('click',event=>{if(event.target.id==='lightbox')event.currentTarget.classList.add('hidden')});
  function startWork(jobId){if(!profile||isWorking())return;const job=jobs.find(item=>item.id===jobId);if(!job)return;const daily=dailyLaborQuota();if(daily.count>=4){toast('오늘 할 수 있는 노동 4회를 모두 사용했어요.');return}if(daily.lastJob===job.id){toast('같은 노동은 연속으로 할 수 없어요. 다른 일을 골라주세요.');return}daily.count++;daily.lastJob=job.id;saveProfile();workSession={jobId:job.id,reward:workReward(job),startedAt:Date.now(),endsAt:Date.now()+30000};try{localStorage.setItem('naesaeng-work',JSON.stringify(workSession))}catch{}showWorkOverlay();workTick()}
  function isWorking(){return !!workSession&&workSession.endsAt>Date.now()}
  function showWorkOverlay(){if(!workSession)return;const job=jobs.find(item=>item.id===workSession.jobId)||jobs[0],pet=pets[profile.pet],stage=stageFor(profile.level);document.getElementById('workPet').src=stage===0?pet.home:pet.stages[stage];document.getElementById('workPet').alt=`${pet.pet} · ${job.name} 중`;document.getElementById('workEmoji').textContent=job.emoji;document.getElementById('workTitle').textContent=`${job.name} 노동 중`;document.getElementById('workDescription').textContent=`${job.desc} 조금만 기다려 주세요.`;workOverlay.classList.remove('hidden')}
  function workTick(){if(!workSession)return;const job=jobs.find(item=>item.id===workSession.jobId)||jobs[0],now=Date.now(),remaining=Math.max(0,workSession.endsAt-now),seconds=Math.ceil(remaining/1000),elapsed=30000-remaining;document.getElementById('workCountdown').textContent=`00:${String(seconds).padStart(2,'0')}`;document.getElementById('workProgress').style.width=`${Math.min(100,elapsed/300)}%`;if(remaining<=0){const reward=workSession.reward??workReward(job);workSession=null;try{localStorage.removeItem('naesaeng-work')}catch{}profile.coins+=reward;saveProfile();workOverlay.classList.add('hidden');render();toast(`${job.name} 완료! 코인 +${reward}`);return}setTimeout(workTick,150)}
  function purchaseOrPlace(id){if(!profile)return;const item=catalog.find(value=>value.id===id);if(!item)return;profile.ownedItems ||= [];profile.decorations ||= [];const owned=profile.ownedItems.includes(id),placed=profile.decorations.includes(id);if(!owned){if(profile.coins<item.price){toast('코인이 부족해요. 돈벌기에서 코인을 모아보세요.');return}profile.coins-=item.price;profile.ownedItems.push(id);profile.decorations.push(id);toast(`${item.name}을(를) 샀어요! 홈에 놓았어요.`)}else if(placed){profile.decorations=profile.decorations.filter(value=>value!==id);toast(`${item.name}을(를) 보관했어요.`)}else{profile.decorations.push(id);toast(`${item.name}을(를) 홈에 놓았어요.`)}saveProfile();renderShop();renderProfile()}
  function toast(message){const element=document.getElementById('toast');element.textContent=message;element.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>element.classList.remove('show'),2600)}
  document.addEventListener('keydown',event=>{if(isWorking()){event.preventDefault();event.stopPropagation();return}if(event.key==='Escape'){loginModal.classList.add('hidden');document.getElementById('evolutionModal').classList.add('hidden');document.getElementById('lightbox').classList.add('hidden')}} ,true);
  document.addEventListener('wheel',event=>{if(isWorking())event.preventDefault()},{capture:true,passive:false});document.addEventListener('touchmove',event=>{if(isWorking())event.preventDefault()},{capture:true,passive:false});
  function resumeWorkSession(){if(!workSession)return;if(!profile){workSession=null;try{localStorage.removeItem('naesaeng-work')}catch{}return}if(workSession.endsAt<=Date.now())workTick();else{showWorkOverlay();workTick()}}
  async function applyAuthSession(session){const user=session?.user||null;if((user?.id||'')===(activeUser?.id||''))return;const guestProfile=activeUser?null:profile;activeUser=user;if(user){profile=await loadUserProfile(user,guestProfile);saveProfile()}else profile=null;render()}
  async function initializeSupabase(){if(!supabaseClient){authReady=true;render();if(!profile)openLogin('signup');resumeWorkSession();return}supabaseClient.auth.onAuthStateChange((event,session)=>{if(event!=='INITIAL_SESSION')setTimeout(()=>applyAuthSession(session),0)});const{data,error}=await supabaseClient.auth.getSession();if(error)console.error('Supabase session restore failed:',error);activeUser=data?.session?.user||null;if(activeUser){profile=await loadUserProfile(activeUser,profile);saveProfile()}else profile=loadProfile(null);authReady=true;render();if(!activeUser&&!profile)openLogin('signup');resumeWorkSession()}
  window.addEventListener('storage',event=>{if(event.key==='naesaeng-profile'||(activeUser&&event.key===profileStorageKey(activeUser.id))){profile=loadProfile(activeUser?.id||null);render()}});
  render();initializeSupabase();
})();
</script>
